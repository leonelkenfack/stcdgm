# =============================================================================
# CorrDiff Mini override — BS31b (2026-05-08)
# =============================================================================
# Applies on top of ``training_config.yaml`` via ``OmegaConf.merge``.
# Bumps the Stage 2 diffusion UNet from the diagnostic-sized [32, 64]
# (~1-2 M params) to CorrDiff-Mini sizing [64, 128, 128] (~12-15 M
# params), matching NVIDIA PhysicsNeMo's
# ``examples/weather/corrdiff/conf/base/model_size/mini.yaml``
# (model_channels=64, channel_mult=[1, 2, 2]).
#
# Motivation: the [32, 64] Stage 2 UNet collapsed to identity on μ_HR
# (μ_HR ablation Δ/signal ≈ 96 %, F1 @ p99 = 0.036, RAPSD = 555).
# Per Mardani et al. 2024 (CorrDiff, arXiv:2309.15214) and Karras et al.
# 2022 (EDM, arXiv:2206.00364), insufficient capacity drives the residual
# diffusion toward δ̂ ≈ 0 — the network outputs essentially μ_HR with no
# refinement. See ``architecture_journey.md §6`` for the full rationale,
# bibliography (DOIs), and the BS31 CHAINLOGIC plan.
#
# Stage 1 (encoder + rcn_cell + regression_head) is intentionally NOT
# modified here — its weights load from epoch_last.pth via BS22-24, the
# DAGMA constraint already converged (‖A‖_F ≈ 0.5-0.85), and there is
# no published evidence that Stage 1 capacity must match Stage 2.
# =============================================================================

diffusion:
  unet_kwargs:
    # 3-level UNet, mirrors CorrDiff Mini's [1, 2, 2] channel_mult.
    # Total ~9-12 M parameters (verified via dry-run in
    # scripts/_inspect_unet_attention.py — attention only at level 2).
    layers_per_block: 2          # was 1 → 2 for richer block representations
    block_out_channels: [64, 128, 128]

    # >>> BS32d : attention au smallest level seulement.
    # Précédent (BS31b) plaçait CrossAttnDownBlock2D au level 1
    # (86×90 = 7740 tokens). Avec layers_per_block=2 et le mirror
    # up_blocks (3 attentions par up_block), on aboutissait à 5
    # transformers à seq_len=7740. Avec bs=64 × num_heads=32 × bf16,
    # chaque attention matrix vaut 228 GiB → OOM massif (l'erreur
    # observée 457 GiB correspondait au forward+backward d'une seule
    # layer avant que le runtime n'explose).
    #
    # NVIDIA PhysicsNeMo CorrDiff applique attention uniquement au
    # smallest level (``attn_resolutions: [16]`` dans normal.yaml).
    # On reproduit ce pattern en mettant DownBlock2D / UpBlock2D au
    # level 1 et CrossAttnDownBlock2D au seul level 2 (43×45 =
    # 1935 tokens) où la mémoire reste raisonnable.
    #
    # Memory check à bs=64 × num_heads=4 × bf16 :
    #   level 2 attn matrix : 64 × 4 × 1935² × 2 ≈ 1.8 GiB / layer
    #   5 layers (2 down + 3 up) ≈ 9 GiB total → fits sur A100 80 GiB.
    down_block_types:
      - "DownBlock2D"            # 172×179 — no attn
      - "DownBlock2D"            # 86×90 — no attn (BS32d : was CrossAttnDownBlock2D)
      - "CrossAttnDownBlock2D"   # 43×45 — attn here
    up_block_types:
      - "CrossAttnUpBlock2D"     # 43×45 — attn here
      - "UpBlock2D"              # 86×90 — no attn (BS32d : was CrossAttnUpBlock2D)
      - "UpBlock2D"              # 172×179 — no attn
    mid_block_type: "UNetMidBlock2D"

    # GroupNorm groups must divide every channel count.
    # 64 / 32 = 2, 128 / 32 = 4 → OK.
    norm_num_groups: 32          # was 8 → 32, diffusers default

    # >>> BS32d : neutraliser le piège ``attention_head_dim`` (num_heads).
    # Diffusers 0.36 (issue HF/diffusers#2011) interprète
    # ``attention_head_dim`` comme num_heads pour des raisons de back-compat,
    # ET refuse de prendre ``num_attention_heads`` directement (raise
    # ValueError au constructeur). Donc :
    #   attention_head_dim=N  →  diffusers utilise N comme num_heads
    #   inner_dim = block_out_channels  →  per-head dim = channels / N
    #
    # Précédent (BS31b) : attention_head_dim=32 → 32 heads de dim=4
    # chacune. Avec bs=64 × 32 heads × seq=7740 (level 1), une seule
    # attention matrix faisait 228 GiB → OOM massif.
    #
    # Fix BS32d : attention_head_dim=4 → 4 heads de dim=32 chacune,
    # configuration standard. Combiné avec attention drop au level 1
    # (voir down_block_types ci-dessus), la mémoire d'attention
    # devient ~9 GiB total à bs=64 (vs >1 TiB avant).
    attention_head_dim: 4
    only_cross_attention: [false, false, false]   # length-3 to match 3 levels

    # ``projection_class_embeddings_input_dim`` stays at the auto-computed
    # 768 (= hidden_dim × num_metapaths). In causal_concat mode the class
    # embedding receives a zero placeholder anyway (BS16), so the value
    # is mechanically irrelevant — but the layer must exist with the
    # right shape for the UNet to instantiate.

  # BS34 — tail-aware EDM loss (see architecture_journey / oracle.tex gap closure).
  edm:
    tail_weight:
      enabled: true
      tau95_mmday: 15.0
      tau99_mmday: 35.0
      weight_p95: 5.0
      weight_p99: 10.0

# =============================================================================
# Stage 2 budget — bump 10 → 50 (2026-05-08).
#
# Verdict v2 à epoch 10 :
#   - shortcut brisé (output/target = 0.76, vs 1.0 en v1)
#   - mais F1@p99 = 0.0037 (10× pire que v1)
#   - Spread/RMSE = 0.64 → ensemble très diversifié, moyenne imprécise
#   - Loss trajectory à epoch 3 : 0.55, pas plateau
#
# Diagnostic : sous-entraînement. 10 cached epochs = 710 optimizer
# steps, vs ~5640 steps effectifs du legacy v1 (buggy 8× duplication).
# 50 cached epochs ≈ 3550 steps, comparable à v1 effectif.
#
# Coût : 40 epochs supplémentaires × ~37s = 25 min wall-clock.
# BS18 resume + BS31d arch-drift detect : pas de restart, continuation
# directe depuis epoch 11 puisque l'archi n'a pas changé.
# =============================================================================
two_stage:
  stage2:
    epochs_max: 50
    # BS35-CONTRASTIVE — force Stage 2 to actually USE μ_HR(A_dag).
    # Pre-cache two μ_HR variants (normal + dagless) and add a margin
    # loss so that EDM loss with real μ_HR beats EDM loss with the
    # dagless μ_HR by at least ``margin``. Auto-disabled when
    # run_variant != 'causal' (no DAG to contrast against).
    contrastive_dag:
      enabled: true
      weight: 0.5
      margin: 0.02
      interval: 4               # 1 contrastive pass every N batches
      ablation_mode: zero       # 'zero' | 'random' | 'permute'
      # --- BS35-FAILSAFE (improve signal > cut signal) ---
      # A) Upstream diagnostic thresholds on delta_mu = ||μ_normal − μ_dagless|| / ||μ_normal||
      diagnostic:
        decorative_threshold: 0.01     # < 1% → DAG decorative (warn)
        modest_threshold: 0.10         # 1-10% → modest causal signal
      # B) Progressive lambda decay/recovery based on dag_sensitivity
      decay:
        enabled: true
        warmup_epochs: 2               # no decay during these initial epochs
        decay_factor: 0.5              # λ ← λ * factor when sens < 0
        recovery_factor: 1.5           # λ ← λ * factor when sens > margin (capped at λ_init)
        floor_ratio: 0.01              # λ never below λ_init * floor_ratio
      # C) Auto-tune ablation mode (zero → permute → random) when DAG signal too weak.
      # Only fires when Stage 2 trains for more than ``activate_after_epochs`` epochs.
      # On the quick 15-epoch run, this never activates by design.
      autotune_mode:
        enabled: true
        activate_after_epochs: 15      # min Stage 2 epochs before C can fire
        window_epochs: 3               # rolling window for sensitivity check
        sensitivity_threshold: 0.001   # if avg dag_sens < this AND λ already decayed → swap mode
        mode_progression: [zero, permute, random]
  # BS35: 'causal' (RCN+DAGMA+decoder) | 'noncausal' (RegressionMeanPredictor baseline).
  run_variant: causal

# =============================================================================
# Data sequencing — paper alignment (Bomgni 2026 oracle.tex L1511).
#
# Le papier dit : "Each training sample is a 16-step sequence with a
# stride of 2, so that a single batch element covers 32 days of driver
# history at a two-day cadence."
#
# Notre base config a stride=4 (commentaire : "Équilibre entre données
# et mémoire"). Avec 38 ans × 365 jours / 4 ≈ 3469 samples, ça donne
# ~4513 dans les faits (proche). Avec stride=2 → ~6927 samples (×2),
# matchant le sample count du papier.
#
# Côté mémoire : le passage stride 4→2 ne change rien car chaque sample
# fait 16 timesteps × LR_grid_size, indépendamment du stride. Seul le
# nombre de samples par epoch double.
#
# Conséquence : invalider le cache /content/stage1_cache.pt avant le
# prochain run, sinon BS32b chargera l'ancien cache 4513-samples.
# =============================================================================
data:
  stride: 2

# =============================================================================
# torch.compile — désactivé pour ce run (BS32c).
# Avec block_out_channels=[64,128,128] + batch_size=64, le pass
# ``inductor.pad_mm.should_pad_bmm`` tente d'allouer un fake tensor
# de bench de ~228 GiB sur la nouvelle shape (64, 3, 172, 179) →
# faux OOM (le GPU est libre). Bug connu de torch._inductor sur des
# shapes peu communes ; le contournement standard
# (``torch._inductor.config.shape_padding = False``) marche aussi
# mais désactiver compile entièrement est plus simple et plus sûr
# pour ce run. Le gain compile était 10-20% au mieux, et BS32b
# (forward batché bs=64) éclipse largement cet ordre de grandeur.
# Re-tenter avec compile en mode ``default`` lors d'un run successeur
# si vraiment nécessaire.
# =============================================================================
training:
  compile:
    enabled: false
