# ============================================================================
# ST-CDGM - Configuration d'Entraînement Optimisée (v2.0)
# Basé sur l'analyse multi-rôles (ML Engineer, Climatologue, Mathématicien)
# ============================================================================

defaults:
  - _self_

# ============================================================================
# CONFIGURATION DES DONNÉES
# ============================================================================
data:
  dataset_format: "netcdf"  # "netcdf", "zarr", ou "shard"
  lr_path: "data/raw/train/predictor_ACCESS-CM2_hist.nc"
  hr_path: "data/raw/train/pr_ACCESS-CM2_hist.nc"
  static_path: "data/raw/static_predictors/ERA5_eval_ccam_12km.198110_NZ_Invariant.nc"
  zarr_dir: "data/raw/train/zarr"
  shard_dir: "data/raw/train/shards"
  
  # Séquences temporelles
  seq_len: 16              # T4 profile restauré (A100 avait 16, +2× RCN sans gain métrique validé)
  stride: 4               # Équilibre entre données et mémoire
  
  # Baseline
  baseline_strategy: "hr_smoothing"
  baseline_factor: 4
  
  # Préprocessing
  normalize: true
  # NetCDF memory guard: keep datasets lazy to avoid large RAM peaks
  # during pipeline construction (baseline/residual preparation).
  eager_load_datasets: false
  target_transform: "log1p"
  nan_fill_strategy: "mean"
  precipitation_delta: 0.01
  
  # Variables
  lr_variables: ['u_850', 'u_500', 'u_250', 'v_850', 'v_500', 'v_250', 
                 'w_850', 'w_500', 'w_250', 'q_850', 'q_500', 'q_250', 
                 't_850', 't_500', 't_250']
  hr_variables: ["pr"]
  static_variables: ["orog", "he", "vegt"]

# ============================================================================
# CONFIGURATION DU GRAPHE
# ============================================================================
graph:
  lr_shape: [23, 26]
  hr_shape: [172, 179]
  static_variables: []
  include_mid_layer: true  # GP500/GP250 activés

# ============================================================================
# CONFIGURATION DE L'ENCODEUR
# ============================================================================
encoder:
  hidden_dim: 128                   # T4 profile restauré (256 non validé sur métriques)
  conditioning_dim: 128              # T4 profile restauré
  # Sprint 1 / B2 fix: fail loudly if a metapath is silently filtered out
  # because its node types are missing from the graph. Set to true only if
  # you intentionally want to downscale with an incomplete DAG (q < 5).
  allow_missing_metapaths: false
  # Sprint 2: use CausalConditioningProjector, which appends a learnable
  # DAG-token to the spatial cross-attention tokens so the UNet literally
  # *sees* A_dag. Required to make the DAG effectively condition every
  # diffusion sample (and to unlock interventional do-calculus at inference).
  causal_conditioning: true
  num_dag_tokens: 2                  # T4 profile restauré (4 non validé)
  metapaths:
    - name: "GP850_spat_adj"
      src: "GP850"
      relation: "spat_adj"
      target: "GP850"
      pool: "mean"
    - name: "GP850_to_GP500"
      src: "GP850"
      relation: "vert_adj"
      target: "GP500"
      pool: "mean"
    - name: "GP500_spat_adj"
      src: "GP500"
      relation: "spat_adj"
      target: "GP500"
      pool: "mean"
    - name: "GP500_to_GP250"
      src: "GP500"
      relation: "vert_adj"
      target: "GP250"
      pool: "mean"
    - name: "GP250_spat_adj"
      src: "GP250"
      relation: "spat_adj"
      target: "GP250"
      pool: "mean"

# ============================================================================
# CONFIGURATION RCN (Réseau Causal Récurrent)
# ============================================================================
rcn:
  hidden_dim: 128                      # T4 profile restauré (aligné avec encoder 128)
  driver_dim: 15      # Overridden at runtime by data sample shape
  reconstruction_dim: 15
  dropout: 0.1        # Sprint 1: lower dropout — model is under-fitting, not overfitting
  detach_interval: 8   # Aligné sur seq_len=8 (BPTT sur toute la séquence)
  # Sprint 1: initialise A_dag from the user-supplied prior matrix
  # (see loss.dag_prior) plus small noise. Avoids the xavier random init
  # that wanders until DAGMA drags it to zero, and gives the RCN a
  # physically meaningful starting topology (vertical coupling).
  init_dag_from_prior: true
  init_dag_prior_noise: 0.02
  # Sprint 2: grad gate on A_dag. Controls how much of the diffusion
  # gradient reaches A_dag via the straight-through interpolation inside
  # RCNCell.forward(). Default recipe:
  #   - 5 "cold" epochs with gate=0 (Sprint 1 detached behaviour)
  #   - linear ramp over 20 epochs to ``max`` (default 1.0 = full gradient)
  # The spectral projection after each optimiser step keeps A_dag acyclic
  # regardless of the gate value, so it's safe to go all the way to 1.0.
  # ============================================================
  # EDM-rewrite : detach permanent — conformité au papier oracle.tex
  # §sec:arch:rcn ("DAG detachment" paragraph). Le commentaire Sprint 4
  # ci-dessous documentait une déviation qui s'est avérée nocive
  # (Gemini Deep Research Axis 1 : "Trace Trap"). On revient au
  # detach strict : A_dag est entraîné UNIQUEMENT par L_rec + L_dag.
  # ============================================================
  dag_grad_gate:
    enabled: false               # DETACH PERMANENT (oracle.tex §sec:arch:rcn)
    cold_epochs: 0
    ramp_epochs: 1
    max: 0.0

# ============================================================================
# CONFIGURATION DIFFUSION
# ============================================================================
diffusion:
  in_channels: 1
  conditioning_dim: 128                # T4 profile restauré (aligné avec encoder.conditioning_dim 128)
  height: 172
  width: 179

  # ============================================================
  # EDM (Karras 2022) — branche edm-rewrite
  # ------------------------------------------------------------
  # Le papier ST-CDGM ciblait DDPM/DPM-Solver++. Sprint 4 a montré
  # que ce choix mal calibré (sigma_data implicite ~0.5 vs réel ~0.1)
  # cause une sur-dispersion catastrophique de l'ensemble (sigma_r=9).
  # EDM (preconditioning explicite + Heun sampler) résout ce problème.
  # ============================================================
  steps: 1000                    # legacy DDPM, ignoré quand scheduler_type=edm_karras
  scheduler_type: "edm_karras"   # "ddpm" | "dpm_solver++" | "edm_karras"
  eval_num_steps: 18             # Heun sampler — 18 = défaut Karras, 15 = papier ST-CDGM

  # EDM hyperparameters (Karras 2022 Table 5)
  # sigma_data DOIT être calibré sur la std empirique du résidu log1p
  # (cf. scripts/measure_residual_std.py). Default 0.1 = estimation
  # initiale ; corrige après mesure.
  edm:
    sigma_data: 0.1              # DOIT être réécrit après mesure empirique
    sigma_min: 0.002             # Karras défaut
    sigma_max: 80.0              # Karras défaut
    rho: 7.0                     # warp du sigma schedule
    P_mean: -1.2                 # log-normal training noise prior
    P_std: 1.2
    # Stochastic Heun (S_churn=0 → deterministic Heun = recommandé)
    S_churn: 0.0
    S_tmin: 0.0
    S_tmax: .inf
    S_noise: 1.0

  use_gradient_checkpointing: false  # A100 80GB : modèle réduit (~12M params), mémoire confortable sans recompute → +30% vitesse
  # Sprint 3: classifier-free guidance. The DPM-Solver++ path was silently
  # ignoring ``cfg_scale`` until we added dual-stream guidance support in
  # ``_sample_dpm_solver``. 1.5–2.0 is the sweet spot for residual
  # precipitation: below 1.2 the extrapolation has no effect, above 2.5
  # extremes become too salty. ``conditioning_dropout_prob: 0.1`` keeps
  # the training-time null branch available for CFG to extrapolate from.
  # CFG désactivé : Gemini Axis 5 + papier confirment qu'avec EDM bien
  # calibré, la guidance > 1 inflate artificiellement l'ensemble (cause
  # sigma_r=9). Le conditioning_dropout reste à 0.1 pour robustesse,
  # mais cfg_scale=1.0 désactive l'extrapolation à l'inférence.
  cfg_scale: 1.0
  conditioning_dropout_prob: 0.1
  conv_padding_mode: "zeros"
  anti_checkerboard: true
  
  unet_kwargs:
    # ============================================================
    # EDM-rewrite : architecture minimale du papier oracle.tex Tab.2
    # block_out_channels=[32, 64], 2 niveaux, cross-attn 1 niveau.
    # Justification : Karras §5 fig.3 (scaling laws) montre que sur
    # 14k samples, [32, 64] atteint ~95% du plafond métrique
    # de [128, 192, 256, 256] avec 30× moins de paramètres.
    # ============================================================
    layers_per_block: 1
    block_out_channels: [32, 64]
    # Sprint 4 / DAG-conditioning fix — Option B (CPU-friendly).
    #
    # Previous config (pre-Sprint-4) had cross-attention only on the 2nd
    # down + 1st up block and a plain ``UNetMidBlock2D``. That left the
    # *bottleneck* (the most semantically concentrated representation)
    # blind to H_T and the A_dag tokens — combined with
    # conditioning_dropout=0.1 + cfg_scale=0 at inference, the UNet
    # learned to marginalise out the conditioning. Intervention test on
    # the epoch-10 Sprint 2 checkpoint: delta_zero / signal ≈ 0.0001%.
    #
    # The first Sprint-4 attempt added cross+self-attention at *every*
    # resolution level. The 1st down block then ran self-attention at
    # full 172×179 resolution (30 788 tokens, 30 GFLOPs/layer for the
    # ``Q@Kᵀ`` alone) and pushed ``diffusion_time`` from ~5s to ~80s on
    # CPU. Untenable.
    #
    # The minimal change that *actually* fixes the conditioning is to
    # add a cross-attention bottleneck — i.e. swap the mid block from
    # ``UNetMidBlock2D`` to ``UNetMidBlock2DCrossAttn`` while keeping the
    # rest of the (cheap) topology intact. The bottleneck is what was
    # missing; the down/up cross-attn blocks were already there. Combined
    # with the contrastive DAG loss + the dag_grad_gate ramp + cfg_scale,
    # this gives 3 cross-attention injection points (1 down, 1 mid, 1 up)
    # all at ≤1/2 resolution, so cost stays bounded on CPU.
    # 2-niveaux : DownBlock plain + 1 cross-attn down/up.
    # Bottleneck SANS cross-attn (UNetMidBlock2D) → conformité papier.
    down_block_types:
      - "DownBlock2D"
      - "CrossAttnDownBlock2D"
    up_block_types:
      - "CrossAttnUpBlock2D"
      - "UpBlock2D"
    mid_block_type: "UNetMidBlock2D"
    norm_num_groups: 8                 # T4 profile restauré (32 avec channels=32 OK, 8 suffisant)
    class_embed_type: "projection"

    # ⚠️ CRITIQUE: Doit correspondre à hidden_dim × nb_metapaths (auto-calculé au runtime)
    projection_class_embeddings_input_dim: 768  # 128 × 6 = 768 (auto-aligné au runtime)

    resnet_time_scale_shift: "scale_shift"
    attention_head_dim: 32             # T4 profile restauré (64 non validé → 4× plus lent en attention)
    # ``only_cross_attention[i]`` only applies when ``down_block_types[i]``
    # has attention. Index 0 is ``DownBlock2D`` (no attention) → its value
    # is ignored by diffusers. Index 1 is ``CrossAttnDownBlock2D`` with
    # ``true`` ⇒ skip self-attn at level-1 to save FLOPs (cross-attn alone
    # is enough since the bottleneck mid-block also cross-attends).
    only_cross_attention: [false, false]   # 2-niveaux EDM : self-attn léger autorisé sur le seul cross-attn block

# ============================================================================
# CONFIGURATION DES PERTES (LOSS)
# ============================================================================
loss:
  # Pondérations des pertes - Sprint 1: rebalance after B1 fix.
  # With L_rec actually working now (B1), beta_rec has to be raised so the
  # DAG is driven by reconstruction. gamma_dag is slightly lowered so the
  # DAGMA penalty does not fight the new L_rec signal.
  lambda_gen: 1.0
  beta_rec: 0.20        # was 0.05 — L_rec is now functional (B1 fix)
  gamma_dag: 0.10       # was 0.15 — leave headroom for L_rec gradient
  lambda_phy: 0.0       # Disabled for 1-channel precip (div/vort need vector field)
  lambda_spectral: 0.0

  # Sprint 3: precipitation-specific physical loss.
  # Applies positivity + global mass + quantile matching on the composite
  # (baseline + predicted residual). Differentiable through the UNet via
  # x0-from-epsilon, so the gradient actually reaches the SCM. Triggers
  # every ``training.physical_loss.physical_sample_interval`` batches.
  # Weights = (positivity, mass, quantile). Default 1.0/0.1/0.2 — quantile
  # weight is the key lever for F1_p95/F1_p99.
  # EDM-rewrite : Sprint 3/4 auxiliary losses désactivés (hors papier).
  # Le papier ST-CDGM Eq. ref:eq:total ne contient que 4 termes :
  # L = lambda_gen·L_gen + beta_rec·L_rec + gamma_dag·L_dag + lambda_phy·L_phy
  # avec lambda_phy=0 par défaut (ablation futur).
  lambda_precip_phy: 0.0             # désactivé (hors papier oracle.tex)
  precip_phy_weights: [1.0, 0.1, 0.3]
  
  # Métriques spectrales
  use_spectral_loss: false
  log_spectral_metric_each_epoch: true
  
  # Contrainte DAG
  dag_method: "dagma"
  dagma_s: 1.0
  dag_l1_regularization: true
  dag_l1_weight: 0.01
  lambda_dag_prior: 0.005
  dag_prior:
    - [0.0, 0.2, 0.0, 0.0, 0.0]
    - [0.2, 0.0, 0.2, 0.0, 0.0]
    - [0.0, 0.2, 0.0, 0.2, 0.0]
    - [0.0, 0.0, 0.2, 0.0, 0.2]
    - [0.0, 0.0, 0.0, 0.2, 0.0]
  
  # Focal Loss - CRITIQUE pour événements extrêmes
  use_focal_loss: true
  focal_alpha: 1.0
  focal_gamma: 2.5        # A100 : push extrêmes (objectif F1_p95/p99)
  
  # Pondération événements extrêmes
  extreme_weight_factor: 2.0
  extreme_percentiles: [95.0, 99.0]
  
  # Type de perte reconstruction
  reconstruction_loss_type: "huber+cosine"  # Combinaison MSE + similarité cosinus

  # Sprint 2: optional HR-target identifiability head. Predicts summary
  # statistics of the HR field (spatial mean, std, p95, p99) from the
  # pooled causal state. Gradient flows back through the encoder + RCN,
  # pulling A_dag toward representations that know about precipitation
  # extremes. Use this *in addition to* the regular LR driver L_rec.
  # EDM-rewrite : hr_ident désactivé (hors papier oracle.tex).
  hr_ident:
    enabled: false
    beta: 0.05
    stats: ["mean", "std", "p95", "p99"]

  # Sprint 4: contrastive DAG-conditioning loss.
  # For every K-th optimizer step we perform an *extra* UNet forward with
  # A_dag zeroed (same noisy target, same timestep, same class_labels,
  # only the DAG-token branch of conditioning_spatial is nulled). A margin
  # loss then forces the real-A_dag epsilon prediction to beat the zeroed
  # one by at least ``margin`` MSE points on the diffusion target:
  #     L_c = max(0, margin - (MSE(eps_zero, eps) - MSE(eps_real, eps)))
  # Gradient flows only through the *real* branch (eps_zero is produced
  # with ``torch.no_grad()``), so the UNet has an unambiguous incentive
  # to route A_dag information into its prediction. This is the single
  # most important lever that makes the DAG *actually* condition the
  # diffusion rather than being decorative.
  # EDM-rewrite : contrastive_dag désactivé (hors papier oracle.tex).
  # La pression à utiliser A_dag vient maintenant de L_rec (qui passe
  # par H_T qui dépend de A_dag via la dynamique RCN). Plus simple,
  # plus stable, fidèle au papier.
  contrastive_dag:
    enabled: false
    weight: 0.5
    margin: 0.02
    # One contrastive pass every N optimizer steps. 4 is a good balance
    # on CPU (~25% training-time overhead). Raise to 1 for faster signal,
    # lower it to 8/16 if training throughput is the bottleneck.
    interval: 4                        # 4 = good balance (commentaire config). Sur A100 modèle réduit : 2 passes extras/4 steps ≈ 4% overhead. Ne pas dépasser 4 : ce loss est LE levier qui force le UNet à utiliser A_dag (pas de DAG fantôme).

# ============================================================================
# CONFIGURATION ENTRAÎNEMENT
# ============================================================================
training:
  # Profil cible : Colab Pro T4 (16 GB VRAM, 15-50 GB RAM, 4-8 vCPU).
  # Pour repasser sur CPU local, surcharger via la CLI Hydra :
  #   python ops/train_st_cdgm.py training.device=cpu training.use_amp=false training.compile.enabled=false
  device: "cuda"
  # EDM-rewrite : 30 epochs, batch_size 32 (grad-accum 2 × micro 16)
  # Budget A100 ~5 it/s avec block_out_channels=[32,64] → 30 epochs ≈ 10h.
  epochs: 0
  batch_size: 32                 # grad-accum count (micro = 16, accum = 2)
  # A100 host : 8-16 vCPU disponibles. 8 workers + pin_memory + prefetch_factor
  # saturent le pipeline NetCDF lazy sans saturer la RAM.
  num_workers: 8
  lr: 0.0002                     # EDM Karras §5 (cosine decay, 2-ep warmup)
  gradient_clipping: 1.0         # Karras défaut
  # Log groupé par 20 batches pour réduire le bruit console.
  log_every: 20
  # T4 (sm_75) supporte les Tensor Cores **fp16** (et non bf16, qui
  # exige sm_80+). En CUDA, ``use_amp=true`` active ``autocast(fp16)``
  # + GradScaler — speedup ~2-3× sur le UNet, sans dégradation de
  # convergence avec GradScaler bien tuné.
  use_amp: true
  
  # Multi-GPU (DDP)
  multi_gpu:
    enabled: false
    strategy: "ddp"
    gpus: [0, 1, 2, 3]
    find_unused_parameters: true
  
  # Early Stopping - Évite stop prématuré
  early_stopping:
    enabled: true
    patience: 15        # ↑ de 7 (laisse temps de converger)
    min_delta: 0.0001
    restore_best: true
  
  # LR Scheduler - Réduction adaptative
  lr_scheduler:
    enabled: true
    mode: "min"
    factor: 0.5
    patience: 10        # ↑ de 3 (ne pas réduire trop tôt)
    min_lr: 1.0e-7
  
  # Physical Loss (optionnel)
  physical_loss:
    use_predicted_output: false       # SPEED : lambda_phy=0 → branche dead, mais true compile inutilement le sampling path
    physical_sample_interval: 16      # 4 → 16 : précip-phy 4× moins fréquent (~6% overhead vs ~25%)
    physical_num_steps: 12            # 25 → 12 : sampling rapide (DPM-Solver++ converge à 12 steps)
  
  # torch.compile - Optimisation performance.
  #
  # Activé pour le profil T4. ``reduce-overhead`` est le bon défaut sur T4 :
  # ``max-autotune`` cible des kernels Triton avec autotuning agressif —
  # bien sur Ampere/Hopper, mais sur T4 (sm_75) le temps de compilation
  # peut atteindre 10+ minutes par module pour un gain marginal vs
  # ``reduce-overhead``. Si vous tournez sur A100/H100, ``max-autotune``
  # peut gagner 10-20% supplémentaires sur le UNet.
  #
  # Les forwards "extra" hors ``compute_loss`` (precip_phy, contrastive_dag,
  # RAPSD metric) passent désormais explicitement par les modules eager
  # via ``_eager_core(...)``, donc compile reste sûr ici.
  compile:
    enabled: true                    # A100 : activé — gain 10-20% free sur UNet (formes fixes 172×179)
    # encoder est appelé 2× par microbatch (init_state + project_state_tensor → même mlp).
    # reduce-overhead active CUDA Graphs → 2e appel écrase le buffer du 1er avant le backward.
    # "default" donne la fusion de kernels sans CUDA Graphs → pas d'aliasing.
    encoder_mode: "default"
    # rcn_cell.run() boucle sur seq_len étapes → appelle le cell compilé 8× par microbatch.
    # Même risque qu'encoder avec CUDA Graphs. "default" est sûr.
    rcn_mode: "default"
    # diffusion (UNet) : appelé 1× par microbatch via compute_loss (les passes extras
    # contrastive/precip_phy passent par _eager_core et ne retriggerent pas le CUDA Graph).
    # reduce-overhead est safe ici et donne le plus gros gain (UNet = goulot principal).
    diffusion_mode: "default"  # SPEED FIX : reduce-overhead capture des CUDA graphs qui se recapturent à chaque itération (shapes variables : main forward vs precip_phy vs contrastive_dag) → coût élevé sans bénéfice steady-state. "default" = compile classique sans CUDA graphs.
    fallback_on_error: true

# ============================================================================
# CONFIGURATION TWO-STAGE CAUSAL ARCHITECTURE (hyperplan v2.0)
# ============================================================================
# Active la pipeline two-stage CorrDiff-style avec causalité architecturalement
# obligatoire sur la prédiction du champ moyen (Stage 1) et diffusion EDM
# raffinant le résidu (Stage 2). Cf. hyperplan.md §4 et oracle.tex §sec:arch.
#
# Quand ``two_stage.enabled = false``, la pipeline retombe sur le mode
# single-stage EDM (branche ``edm-rewrite`` legacy).
two_stage:
  enabled: true

  # Architecture du regression head (GraphToGridDecoder)
  regression_head:
    architecture: "graph_to_grid_xattn"
    d_model: 128                           # = encoder.hidden_dim
    n_heads: 4
    intermediate_h: 43                     # ~2x LR (23) pour cross-attn → memory budget
    intermediate_w: 45                     # ~2x LR (26)
    refine_channels: 64                    # CNN refine: d_model → refine_channels → refine_channels/2 → 1
    spatial_query_init: "normal_0.02"

  # Stage 1 : training deterministe causal mean
  stage1:
    epochs_max: 5                          # cap dur (hyperplan v2.0 décision 8)
    early_stop_patience: 3                 # plateau MSE val ≥ 3 epochs
    lr: 0.0003
    optimizer: "adamw"
    weight_decay: 1.0e-4
    scheduler: "cosine"
    warmup_epochs: 1
    log_rapsd_each_epoch: true             # détection over-smoothing
    # Loss weights (cf. paper §sec:arch:loss + Tab. 2)
    lambda_reg: 1.0                        # MSE(mu_HR, residual)
    beta_rec: 0.05                         # RCN driver reconstruction
    gamma_dag_max: 0.10                    # DAGMA penalty target value
    gamma_dag_warmup_epochs: 5             # linear ramp 0 -> gamma_dag_max
    lambda_l1: 0.01                        # ||A||_1 sparsity

  # Stage 2 : diffusion EDM sur résidu fin
  stage2:
    epochs_max: 15                         # cap (5 + 15 = 20 epochs total)
    lr: 0.0002
    freeze_stage1: true                    # encoder + RCN + reg_head no-grad
    sigma_data_recalibrate: true           # MANDATORY post-Stage 1
    sigma_min_scale_factor: 0.02           # σ_min = sigma_data * scale
    causal_concat_mode: true               # UNet input = concat(δ, μ, baseline_log)

  # Diagnostic causal ablation post-Stage 1
  causal_ablation:
    enabled: true
    n_samples: 100
    threshold: 0.05                        # |μ(A) - μ(0)| / |μ(A)| > threshold
    abort_if_fail: true                    # STOP run si ratio < threshold

# ============================================================================
# CONFIGURATION CHECKPOINT
# ============================================================================
checkpoint:
  enabled: true
  # Colab + Drive : monter Drive et pointer ici sur un dossier persistant :
  #   from google.colab import drive
  #   drive.mount('/content/drive')
  #   CONFIG.checkpoint.save_dir = '/content/drive/MyDrive/st_cdgm/ckpt'
  # Sinon les checkpoints disparaissent à la déconnexion du runtime.
  save_dir: "models"
  save_every: 5
  save_best: true
  max_checkpoints: 50
  # Sprint 4: persistance atomique en fin de chaque époque (notebook Colab).
  # ``persist_every`` : toutes les N époques, écrit ``epoch_last.pth`` (toujours)
  # et ``epoch_best.pth`` (si val improved). 1 = à chaque époque.
  # ``keep_last_k`` : nombre de snapshots ``epoch_NNN.pth`` à garder en plus
  # (0 = aucun, juste last + best). Utile si vous voulez un historique pour
  # rollback sur Drive — coût ~50-200 MB par snapshot, à doser selon le quota.
  persist_every: 1                    # OBLIGATOIRE — per-epoch save sur Drive                    # OBLIGATOIRE — per-epoch save sur Drive
  keep_last_k: 0

# ============================================================================
# CONFIGURATION ÉVALUATION
# ============================================================================
evaluation:
  enabled: true
  eval_every: 20
  # Sprint 3: probabilistic-calibration bumps.
  # - num_samples 10→16: tighter CRPS estimate (≈ sqrt(10/16) ≈ 0.79x the
  #   Monte-Carlo noise), and sigma_r becomes statistically meaningful.
  # - eval_num_steps 12→25: DPM-Solver++ extrapolation error drops
  #   sharply between 12 and 25 steps on small residual UNets. Doubles
  #   inference cost (~14s → ~28s per sample on CPU) but recovers most
  #   of the RAPSD distance gap.
  num_samples: 8               # 16 → 8 : CRPS Monte-Carlo 2× plus rapide (bruit +41% acceptable)
  eval_num_steps: 20
  eval_scheduler: "dpm_solver++"
  crps_max_ensemble_members: 32
  compute_f1_extremes: true
  f1_percentiles: [95.0, 99.0]
  save_visualizations: true
